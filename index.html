<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Public School Andharkotha - Result Portal</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f7f6;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}

.logo {
    width: 140px;
    height: 140px;
    display: block;
    margin: auto;
    border-radius: 50%;
    object-fit: cover;
}

h1 {
    text-align: center;
    color: #003399;
    margin-top: 10px;
}

h2 {
    text-align: center;
    color: #ff9800;
    margin-top: 5px;
}

.tagline {
    text-align: center;
    margin-bottom: 15px;
    color: #666;
}

hr {
    margin: 15px 0;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

select, input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #003399;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #0055cc;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

table, th, td {
    border: 1px solid #ccc;
}

th {
    background: #003399;
    color: white;
    padding: 10px;
    font-size: 14px;
}

td {
    padding: 10px;
    text-align: center;
    font-size: 14px;
}

.info {
    line-height: 28px;
    margin-top: 15px;
}

.pass {
    color: green;
    font-weight: bold;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #666;
}
</style>
</head>

<body>

<!-- ================= STUDENT PORTAL VIEW ================= -->
<div class="container" id="studentPortal">
    <img src="Screenshot_20260724-185055.jpg" class="logo" alt="School Logo">

    <h1>SMART PUBLIC SCHOOL</h1>
    <h2>ANDHARKOTHA</h2>
    <h2 style="text-align:center;color:#003399; font-size: 18px;">
    FIRST TERMINAL EXAMINATION 2026-27
    </h2>

    <p class="tagline">Dream Learn Achieve</p>
    <hr>

    <label for="class">Select Class</label>
    <select id="class">
        <option value="">-- Select Class --</option>
        <option>Nursery A</option> 
        <option>Nursery B</option>
        <option>Nursery C</option>
        <option>LKG</option>
        <option>UKG</option>
        <option>Class 1</option>
        <option>Class 2</option>
        <option>Class 3</option>
    </select>

    <label for="roll">Enter Roll Number</label>
    <input type="number" id="roll" placeholder="Enter Roll Number">

    <button onclick="checkResult()">Check Result</button>

    <div id="result"></div>

    <!-- Teacher Login Trigger Button -->
    <button onclick="openLogin()" style="background:#0d47a1;">🔒 Teacher Login</button>

    <div class="footer">
    © Smart Public School Andharkotha
    </div>
</div>

<!-- ================= TEACHER DASHBOARD VIEW (Hidden by default) ================= -->
<div class="container" id="teacherDashboard" style="display:none; max-width: 750px;">
    <h2 style="color:#003399; font-size: 20px;">👨‍🏫 Teacher Dashboard - Add Student Result</h2>
    <hr>
    
    <button onclick="logoutTeacher()" style="background:red; width:auto; padding: 8px 15px; float: right; margin-top:0;">Logout</button>
    <div style="clear: both;"></div>

    <!-- Form to Add New Student -->
    <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 10px;">
        <h3 style="margin-top:0; color:#333;">Add New Student Result</h3>
        
        <label>Student Name</label>
        <input type="text" id="newName" placeholder="Enter Student Name">

        <label>Father's Name</label>
        <input type="text" id="newFather" placeholder="Enter Father's Name">

        <label>Select Class</label>
        <select id="newClass">
            <option>Nursery A</option> 
            <option>Nursery B</option>
            <option>Nursery C</option>
            <option>LKG</option>
            <option>UKG</option>
            <option>Class 1</option>
            <option>Class 2</option>
            <option>Class 3</option>
        </select>

        <label>Roll Number</label>
        <input type="number" id="newRoll" placeholder="Enter Roll Number">

        <label>Hindi Marks (Out of 100)</label>
        <input type="number" id="newHindi" placeholder="Marks in Hindi">

        <label>English Marks (Out of 100)</label>
        <input type="number" id="newEnglish" placeholder="Marks in English">

        <label>Maths Marks (Out of 100)</label>
        <input type="number" id="newMath" placeholder="Marks in Maths">

        <button onclick="addNewStudent()" style="background:green; margin-top:15px;">💾 Save & Upload Result</button>
    </div>

    <h3 style="margin-top: 25px;">All Uploaded Students List</h3>
    <table>
        <tr>
            <th>Roll</th>
            <th>Name</th>
            <th>Class</th>
            <th>Total</th>
            <th>Action</th>
        </tr>
        <tbody id="dashboardTableBody">
            <!-- Data will load here dynamically -->
        </tbody>
    </table>
</div>

<!-- Login Box Modal -->
<div id="loginBox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
    <div style="background:white; width:320px; padding:20px; border-radius:10px; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">
        <h2 style="text-align:center; color:#003399;">Teacher Login</h2>
        <input type="text" id="userid" placeholder="Enter User ID">
        <input type="text" id="schoolcode" placeholder="Enter School Code" style="margin-top:10px;">
        <input type="password" id="password" placeholder="Enter Password" style="margin-top:10px;">

        <button onclick="teacherLogin()" style="background:green; margin-top:15px;">Login</button>
        <button onclick="closeLogin()" style="background:red; margin-top:10px;">Close</button>
    </div>
</div>

<script>
// डिफ़ॉल्ट डेटा (अगर पहले से कुछ न हो)
if (!localStorage.getItem("schoolStudents")) {
    let defaultData = [
        { roll: "1", name: "Sameem Sheikh", father: "Abdul Sheikh", cls: "Class 3", hindi: 50, english: 63, math: 43 },
        { roll: "3", name: "Simran Khatoon", father: "Safi Kulshit", cls: "Nursery A", hindi: 89, english: 74, math: 63 }
    ];
    localStorage.setItem("schoolStudents", JSON.stringify(defaultData));
}

// छात्र रिजल्ट चेक करने का फंक्शन
function checkResult() {
    let roll = document.getElementById("roll").value.trim();
    let cls = document.getElementById("class").value;

    let students = JSON.parse(localStorage.getItem("schoolStudents")) || [];
    let student = students.find(s => s.roll === roll && s.cls === cls);

    if (student) {
        let total = Number(student.hindi) + Number(student.english) + Number(student.math);
        let percent = ((total / 300) * 100).toFixed(2);

        document.getElementById("result").innerHTML = `
            <div class="info">
                <b>Student Name :</b> ${student.name}<br>
                <b>Father's Name :</b> ${student.father}<br>
                <b>Roll No :</b> ${student.roll}<br>
                <b>Class :</b> ${student.cls}
            </div>
            <table>
                <tr><th>Subject</th><th>Marks</th><th>Full Marks</th></tr>
                <tr><td>Hindi</td><td>${student.hindi}</td><td>100</td></tr>
                <tr><td>English</td><td>${student.english}</td><td>100</td></tr>
                <tr><td>Mathematics</td><td>${student.math}</td><td>100</td></tr>
                <tr><th>Total</th><th>${total}</th><th>300</th></tr>
                <tr><th colspan="2">Percentage</th><th>${percent}%</th></tr>
                <tr><th colspan="2">Result</th><th class="pass">PASS</th></tr>
            </table>
            <br>
            <p><b>Class Teacher :</b> Shail Aktar</p>
            <p><b>Principal :</b> Shail Aktar</p>
            <button onclick="window.print()">📄 Download / Print Result</button>
        `;
    } else {
        document.getElementById("result").innerHTML = `
            <h2 style="color:red; text-align:center; margin-top:20px;">Result Not Found</h2>
        `;
    }
}

// नया स्टूडेंट एडमिन पैनल से जोड़ने का फंक्शन
function addNewStudent() {
    let name = document.getElementById("newName").value.trim();
    let father = document.getElementById("newFather").value.trim();
    let cls = document.getElementById("newClass").value;
    let roll = document.getElementById("newRoll").value.trim();
    let hindi = Number(document.getElementById("newHindi").value);
    let english = Number(document.getElementById("newEnglish").value);
    let math = Number(document.getElementById("newMath").value);

    if (!name || !roll || !father) {
        alert("कृपया सभी जरूरी जानकारी भरें!");
        return;
    }

    let students = JSON.parse(localStorage.getItem("schoolStudents")) || [];
    
    // चेक करें कि इस रोल नंबर का बच्चा उस क्लास में पहले से तो नहीं है
    let existing = students.find(s => s.roll === roll && s.cls === cls);
    if (existing) {
        alert("इस क्लास में इस रोल नंबर का रिजल्ट पहले से मौजूद है!");
        return;
    }

    let newStudent = { roll, name, father, cls, hindi, english, math };
    students.push(newStudent);
    localStorage.setItem("schoolStudents", JSON.stringify(students));

    alert("छात्र का रिजल्ट सफलतापूर्वक अपलोड हो गया है!");
    
    // फॉर्म खाली करें
    document.getElementById("newName").value = "";
    document.getElementById("newFather").value = "";
    document.getElementById("newRoll").value = "";
    document.getElementById("newHindi").value = "";
    document.getElementById("newEnglish").value = "";
    document.getElementById("newMath").value = "";

    loadDashboardTable();
}

// डैशबोर्ड टेबल लोड करने का फंक्शन
function loadDashboardTable() {
    let students = JSON.parse(localStorage.getItem("schoolStudents")) || [];
    let tbody = document.getElementById("dashboardTableBody");
    tbody.innerHTML = "";

    students.forEach((student, index) => {
        let total = Number(student.hindi) + Number(student.english) + Number(student.math);
        tbody.innerHTML += `
            <tr>
                <td>${student.roll}</td>
                <td>${student.name}</td>
                <td>${student.cls}</td>
                <td>${total} / 300</td>
                <td><button onclick="deleteStudent(${index})" style="background:red; padding:5px 10px; margin:0; font-size:12px;">Delete</button></td>
            </tr>
        `;
    });
}

// छात्र को डिलीट करने का फंक्शन
function deleteStudent(index) {
    if (confirm("क्या आप वाकई इस रिजल्ट को डिलीट करना चाहते हैं?")) {
        let students = JSON.parse(localStorage.getItem("schoolStudents")) || [];
        students.splice(index, 1);
        localStorage.setItem("schoolStudents", JSON.stringify(students));
        loadDashboardTable();
    }
}

function openLogin() {
    document.getElementById("loginBox").style.display = "block";
}

function closeLogin() {
    document.getElementById("loginBox").style.display = "none";
}

function teacherLogin() {
    let user = document.getElementById("userid").value;
    let code = document.getElementById("schoolcode").value;
    let pass = document.getElementById("password").value;

    if (user === "teacher" && code === "SPS2026" && pass === "Smart@123") {
        alert("Login Successful");
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("studentPortal").style.display = "none";
        document.getElementById("teacherDashboard").style.display = "block";
        loadDashboardTable();
    } else {
        alert("Wrong User ID, School Code or Password");
    }
}

function logoutTeacher() {
    document.getElementById("teacherDashboard").style.display = "none";
    document.getElementById("studentPortal").style.display = "block";
    document.getElementById("userid").value = "";
    document.getElementById("schoolcode").value = "";
    document.getElementById("password").value = "";
}
</script>

</body>
</html>
