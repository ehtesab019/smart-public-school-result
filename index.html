<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Public School Andharkotha - Result Portal</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f7f6;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}

.logo {
    width: 140px;
    height: 140px;
    display: block;
    margin: auto;
    border-radius: 50%;
    object-fit: cover;
}

h1 {
    text-align: center;
    color: #003399;
    margin-top: 10px;
}

h2 {
    text-align: center;
    color: #ff9800;
    margin-top: 5px;
}

.tagline {
    text-align: center;
    margin-bottom: 15px;
    color: #666;
}

hr {
    margin: 15px 0;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

select, input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #003399;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #0055cc;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

table, th, td {
    border: 1px solid #ccc;
}

th {
    background: #003399;
    color: white;
    padding: 10px;
    font-size: 14px;
}

td {
    padding: 8px;
    text-align: center;
    font-size: 14px;
}

.info {
    line-height: 28px;
    margin-top: 15px;
}

.pass {
    color: green;
    font-weight: bold;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #666;
}
</style>
</head>

<body>

<!-- ================= STUDENT PORTAL VIEW ================= -->
<div class="container" id="studentPortal">
    <img src="Screenshot_20260724-185055.jpg" class="logo" alt="School Logo">

    <h1>SMART PUBLIC SCHOOL</h1>
    <h2>ANDHARKOTHA</h2>
    <h2 style="text-align:center;color:#003399; font-size: 18px;">
    FIRST TERMINAL EXAMINATION 2026-27
    </h2>

    <p class="tagline">Dream Learn Achieve</p>
    <hr>

    <label for="class">Select Class</label>
    <select id="class">
        <option value="">-- Select Class --</option>
        <option>Nursery A</option> 
        <option>Nursery B</option>
        <option>Nursery C</option>
        <option>LKG</option>
        <option>UKG</option>
        <option>Class 1</option>
        <option>Class 2</option>
        <option>Class 3</option>
    </select>

    <label for="roll">Enter Roll Number</label>
    <input type="number" id="roll" placeholder="Enter Roll Number">

    <button onclick="checkResult()">Check Result</button>

    <div id="result"></div>

    <button onclick="openLogin()" style="background:#0d47a1; margin-top:20px;">🔒 Teacher Login</button>

    <div class="footer">
    © Smart Public School Andharkotha
    </div>
</div>

<!-- ================= TEACHER DASHBOARD VIEW ================= -->
<div class="container" id="teacherDashboard" style="display:none; max-width: 700px;">
    <h2 style="color:#003399; font-size: 20px;">👨‍🏫 Teacher Dashboard - Add Student Result</h2>
    <hr>
    
    <button onclick="logoutTeacher()" style="background:red; width:auto; padding: 8px 15px; float: right; margin-top:0;">Logout</button>
    <div style="clear: both;"></div>

    <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 10px;">
        <h3 style="margin-top:0; color:#333;">Add New Student Result</h3>
        
        <label>Student Name</label>
        <input type="text" id="newName" placeholder="Enter Student Name">

        <label>Father's Name</label>
        <input type="text" id="newFather" placeholder="Enter Father's Name">

        <label>Select Class</label>
        <select id="newClass" onchange="toggleSubjectInputs()">
            <option value="">-- Select Class --</option>
            <option>Nursery A</option> 
            <option>Nursery B</option>
            <option>Nursery C</option>
            <option>LKG</option>
            <option>UKG</option>
            <option>Class 1</option>
            <option>Class 2</option>
            <option>Class 3</option>
        </select>

        <label>Roll Number</label>
        <input type="number" id="newRoll" placeholder="Enter Roll Number">

        <label>Class Teacher Name</label>
        <input type="text" id="newTeacher" placeholder="Enter Class Teacher Name">

        <h4 style="margin: 15px 0 5px 0; color:#003399;">Enter Marks (Out of 50 Each)</h4>
        
        <!-- Nursery to UKG Subjects -->
        <div id="nurserySubjects" style="display:none;">
            <label>English</label><input type="number" id="m_eng_n" placeholder="Marks">
            <label>Hindi</label><input type="number" id="m_hin_n" placeholder="Marks">
            <label>Mathematics</label><input type="number" id="m_mat_n" placeholder="Marks">
            <label>Urdu</label><input type="number" id="m_urd_n" placeholder="Marks">
            <label>Speaking</label><input type="number" id="m_spk_n" placeholder="Marks">
            <label>Arbi</label><input type="number" id="m_arb_n" placeholder="Marks">
            <label>Drawing</label><input type="number" id="m_drw_n" placeholder="Marks">
            <label>Dictation</label><input type="number" id="m_dct_n" placeholder="Marks">
        </div>

        <!-- Class 1 to 3 Subjects -->
        <div id="seniorSubjects" style="display:none;">
            <label>English</label><input type="number" id="m_eng_s" placeholder="Marks">
            <label>Hindi</label><input type="number" id="m_hin_s" placeholder="Marks">
            <label>Mathematics</label><input type="number" id="m_mat_s" placeholder="Marks">
            <label>Urdu</label><input type="number" id="m_urd_s" placeholder="Marks">
            <label>Science</label><input type="number" id="m_sci_s" placeholder="Marks">
            <label>SST</label><input type="number" id="m_sst_s" placeholder="Marks">
            <label>Computer</label><input type="number" id="m_cmp_s" placeholder="Marks">
            <label>GK</label><input type="number" id="m_gk_s" placeholder="Marks">
            <label>Speaking</label><input type="number" id="m_spk_s" placeholder="Marks">
            <label>Arbi</label><input type="number" id="m_arb_s" placeholder="Marks">
            <label>Drawing</label><input type="number" id="m_drw_s" placeholder="Marks">
            <label>Dictation</label><input type="number" id="m_dct_s" placeholder="Marks">
        </div>

        <button onclick="addNewStudent()" style="background:green; margin-top:20px;">💾 Save & Upload Result</button>
    </div>

    <h3 style="margin-top: 25px;">All Uploaded Students List</h3>
    <table>
        <tr>
            <th>Roll</th>
            <th>Name</th>
            <th>Class</th>
            <th>Action</th>
        </tr>
        <tbody id="dashboardTableBody"></tbody>
    </table>
</div>

<!-- Login Box Modal -->
<div id="loginBox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
    <div style="background:white; width:320px; padding:20px; border-radius:10px; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">
        <h2 style="text-align:center; color:#003399;">Teacher Login</h2>
        <input type="text" id="userid" placeholder="Enter User ID">
        <input type="text" id="schoolcode" placeholder="Enter School Code" style="margin-top:10px;">
        <input type="password" id="password" placeholder="Enter Password" style="margin-top:10px;">

        <button onclick="teacherLogin()" style="background:green; margin-top:15px;">Login</button>
        <button onclick="closeLogin()" style="background:red; margin-top:10px;">Close</button>
    </div>
</div>

<script>
// डिफॉल्ट डेटा
if (!localStorage.getItem("schoolStudents")) {
    let defaultData = [
        { 
          roll: "1", name: "Sameem Sheikh", father: "Abdul Sheikh", cls: "Class 3", teacher: "Shail Aktar",
          marks: { English: 40, Hindi: 42, Mathematics: 38, Urdu: 45, Science: 41, SST: 39, Computer: 44, GK: 40, Speaking: 42, Arbi: 43, Drawing: 45, Dictation: 38 } 
        },
        { 
          roll: "3", name: "Simran Khatoon", father: "Safi Kulshit", cls: "Nursery A", teacher: "Shail Aktar",
          marks: { English: 45, Hindi: 42, Mathematics: 40, Urdu: 44, Speaking: 41, Arbi: 43, Drawing: 46, Dictation: 42 } 
        }
    ];
    localStorage.setItem("schoolStudents", JSON.stringify(defaultData));
}

function toggleSubjectInputs() {
    let cls = document.getElementById("newClass").value;
    let nurseryDiv = document.getElementById("nurserySubjects");
    let seniorDiv = document.getElementById("seniorSubjects");

    if (cls.includes("Nursery") || cls === "LKG" || cls === "UKG") {
        nurseryDiv.style.display = "block";
        seniorDiv.style.display = "none";
    } else if (cls.includes("Class")) {
        nurseryDiv.style.display = "none";
        seniorDiv.style.display = "block";
    } else {
        nurseryDiv.style.display = "none";
        seniorDiv.style.display = "none";
    }
}

function checkResult() {
    let roll = document.getElementById("roll").value.trim();
    let cls = document.getElementById("class").value;

    let students = JSON.parse(localStorage.getItem("schoolStudents")) || [];
    let student = students.find(s => s.roll === roll && s.cls === cls);

    if (student) {
        let subKeys = Object.keys(student.marks);
        let totalMarksObtained = 0;
        let fullMarksPerSubject = 50;
        let totalFullMarks = subKeys.length * fullMarksPerSubject;

        let tableRows = "";
        for (let sub of subKeys) {
            let m = Number(student.marks[sub]);
            totalMarksObtained += m;
            tableRows += `<tr><td>${sub}</td><td>${m}</td><td>${fullMarksPerSubject}</td></tr>`;
        }

        let percent = ((totalMarksObtained / totalFullMarks) * 100).toFixed(2);
        let teacherName = student.teacher || "Shail Aktar";

        document.getElementById("result").innerHTML = `
            <div class="info">
                <b>Student Name :</b> ${student.name}<br>
                <b>Father's Name :</b> ${student.father}<br>
                <b>Roll No :</b> ${student.roll}<br>
                <b>Class :</b> ${student.cls}
            </div>
            <table>
                <tr><th>Subject</th><th>Marks</th><th>Full Marks</th></tr>
                ${tableRows}
                <tr><th>Total</th><th>${totalMarksObtained}</th><th>${totalFullMarks}</th></tr>
                <tr><th colspan="2">Percentage</th><th>${percent}%</th></tr>
                <tr><th colspan="2">Result</th><th class="pass">PASS</th></tr>
            </table>
            <br>
            <p><b>Class Teacher :</b> ${teacherName}</p>
            <p><b>Principal :</b> Sahil Akhtar</p>
            <button onclick="window.print()">📄 Download / Print Result</button>
        `;
    } else {
        document.getElementById("result").innerHTML = `
            <h2 style="color:red; text-align:center; margin-top:20px;">Result Not Found</h2>
        `;
    }
}

function addNewStudent() {
    let name = document.getElementById("newName").value.trim();
    let father = document.getElementById("newFather").value.trim();
    let cls = document.getElementById("newClass").value;
    let roll = document.getElementById("newRoll").value.trim();
    let teacher = document.getElementById("newTeacher").value.trim() || "Shail Aktar";

    if (!name || !roll || !father || !cls) {
        alert("कृपया सभी जरूरी जानकारी और क्लास भरें!");
        return;
    }

    let marks = {};
    if (cls.includes("Nursery") || cls === "LKG" || cls === "UKG") {
        marks = {
            English: Number(document.getElementById("m_eng_n").value) || 0,
            Hindi: Number(document.getElementById("m_hin_n").value) || 0,
            Mathematics: Number(document.getElementById("m_mat_n").value) || 0,
            Urdu: Number(document.getElementById("m_urd_n").value) || 0,
            Speaking: Number(document.getElementById("m_spk_n").value) || 0,
            Arbi: Number(document.getElementById("m_arb_n").value) || 0,
            Drawing: Number(document.getElementById("m_drw_n").value) || 0,
            Dictation: Number(document.getElementById("m_dct_n").value) || 0
        };
    } else {
        marks = {
            English: Number(document.getElementById("m_eng_s").value) || 0,
            Hindi: Number(document.getElementById("m_hin_s").value) || 0,
            Mathematics: Number(document.getElementById("m_mat_s").value) || 0,
            Urdu: Number(document.getElementById("m_urd_s").value) || 0,
            Science: Number(document.getElementById("m_sci_s").value) || 0,
            SST: Number(document.getElementById("m_sst_s").value) || 0,
            Computer: Number(document.getElementById("m_cmp_s").value) || 0,
            GK: Number(document.getElementById("m_gk_s").value) || 0,
            Speaking: Number(document.getElementById("m_spk_s").value) || 0,
            Arbi: Number(document.getElementById("m_arb_s").value) || 0,
            Drawing: Number(document.getElementById("m_drw_s").value) || 0,
            Dictation: Number(document.getElementById("m_dct_s").value) || 0
        };
    }

    let students = JSON.parse(localStorage.getItem("schoolStudents")) || [];
    let existing = students.find(s => s.roll === roll && s.cls === cls);
    if (existing) {
        alert("इस क्लास में इस रोल नंबर का रिजल्ट पहले से मौजूद है!");
        return;
    }

    students.push({ roll, name, father, cls, teacher, marks });
    localStorage.setItem("schoolStudents", JSON.stringify(students));

    alert("छात्र का रिजल्ट सफलतापूर्वक अपलोड हो गया है!");
    
    // फॉर्म रिसेट करें
    document.getElementById("newName").value = "";
    document.getElementById("newFather").value = "";
    document.getElementById("newRoll").value = "";
    document.getElementById("newClass").value = "";
    document.getElementById("newTeacher").value = "";
    document.getElementById("nurserySubjects").style.display = "none";
    document.getElementById("seniorSubjects").style.display = "none";

    loadDashboardTable();
}

function loadDashboardTable() {
    let students = JSON.parse(localStorage.getItem("schoolStudents")) || [];
    let tbody = document.getElementById("dashboardTableBody");
    tbody.innerHTML = "";

    students.forEach((student, index) => {
        tbody.innerHTML += `
            <tr>
                <td>${student.roll}</td>
                <td>${student.name}</td>
                <td>${student.cls}</td>
                <td><button onclick="deleteStudent(${index})" style="background:red; padding:5px 10px; margin:0; font-size:12px;">Delete</button></td>
            </tr>
        `;
    });
}

function deleteStudent(index) {
    if (confirm("क्या आप वाकई इस रिजल्ट को डिलीट करना चाहते हैं?")) {
        let students = JSON.parse(localStorage.getItem("schoolStudents")) || [];
        students.splice(index, 1);
        localStorage.setItem("schoolStudents", JSON.stringify(students));
        loadDashboardTable();
    }
}

function openLogin() { document.getElementById("loginBox").style.display = "block"; }
function closeLogin() { document.getElementById("loginBox").style.display = "none"; }

function teacherLogin() {
    let user = document.getElementById("userid").value;
    let code = document.getElementById("schoolcode").value;
    let pass = document.getElementById("password").value;

    if (user === "teacher" && code === "SPS2026" && pass === "Smart@123") {
        alert("Login Successful");
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("studentPortal").style.display = "none";
        document.getElementById("teacherDashboard").style.display = "block";
        loadDashboardTable();
    } else {
        alert("Wrong User ID, School Code or Password");
    }
}

function logoutTeacher() {
    document.getElementById("teacherDashboard").style.display = "none";
    document.getElementById("studentPortal").style.display = "block";
    document.getElementById("userid").value = "";
    document.getElementById("schoolcode").value = "";
    document.getElementById("password").value = "";
}
</script>

</body>
</html>
